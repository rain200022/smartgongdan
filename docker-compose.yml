services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: smartgongdan
      POSTGRES_USER: smartgongdan
      POSTGRES_PASSWORD: smartgongdan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgongdan -d smartgongdan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

