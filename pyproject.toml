[project]
name = "smartgongdan-backend"
version = "0.1.0"
description = "M5 backend for the Smart Gongdan ticket system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi[standard]>=0.116,<1",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["RUF001"] # Chinese business text intentionally uses full-width punctuation.
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"] # Importing models registers SQLAlchemy metadata.

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
pretty = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.uv]
required-version = ">=0.12,<0.13"
